test_description:
  Тест Якоря карьеры Шейна: Пожалуйста, прочитайте утверждения и оцените, насколько каждое важно для вас в профессиональной жизни по шкале от 1 до 5, где 1 — совершенно не важно, 5 — чрезвычайно важно (укороченная анкета по ценностям карьеры).
  Тест Якоря карьеры Шейна (полная версия): Пожалуйста, прочитайте утверждения и оцените, насколько каждое верно для вас в профессиональной жизни по шкале от 1 до 6, где 1 — совершенно не про меня, 6 — полностью про меня. Полная адаптация опросника карьерных якорей (не официальный лицензионный продукт).
  Тест Климова (краткий): Те же правила выбора, что и полный опросник Климова, но только 10 пар активностей (экспресс).
  Тест Климова: Представьте, что вам нужно выполнить одну из двух предложенных задач. Какую работу вы бы выбрали? Отметьте предпочитаемый вариант (А или Б)
  Тест MBTI: Выберите тот вариант ответа (А или Б), который вам больше подходит в большинстве жизненных ситуаций
  Тест MBTI (полная версия): Выберите вариант А или Б, который типичнее для вас в учёбе и работе. Расширенная авторская анкета по четырём дихотомиям в традиции типологии Myers–Briggs; не является сертифицированным опросником MBTI®.
  Тест Холланда/RIASEC: 'Оцените, насколько вам была бы интересна каждая из описанных видов деятельности по шкале от 1 до 5, где: 1 - Совершенно не интересно, 5 - Очень интересно'
  Тест Холланда/RIASEC (полная версия): 'Оцените интерес по шкале от 1 до 5 (1 — совершенно не интересно, 5 — очень интересно). Полная внутрисистемная анкета: по 8 активностей на каждый из шести типов интересов по модели Холланда (RIASEC). Не является Vocational Preference Inventory.'
  Тест PCM: Представьте себе типичную рабочую или учебную ситуацию. Какой из вариантов реакции вам больше свойственен? Выберите А или Б
  Тест PCM (полная версия): Выберите А или Б. Расширенная авторская версия самоопросника по базовым каналам коммуникации в духе Process Communication Model (не воспроизводит платный текст PCM Profile®).
