test_questions:
  Тест Якоря карьеры Шейна:
  - Быть признанным экспертом в своей конкретной, узкой области
  - Иметь возможность руководить людьми и влиять на ход событий
  - Иметь стабильную и предсказуемую работу с гарантированной занятостью
  - Постоянно решать уникальные, сложные задачи, бросать вызов самому себе
  - Иметь свободу и независимость в организации своего рабочего процесса
  - Видеть конкретный, измеримый результат своего труда (например, созданный продукт)
  - Работать над идеями и проектами, которые важны лично для меня, даже если это не приносит много денег
  - Иметь такой график работы, который позволяет уделять больше времени личной жизни и семье
  - Осваивать новые навыки и компетенции, развиваться в разных направлениях, а не в одной
  - Приносить пользу обществу, помогать другим людям своими действиями
  - Для меня важно построить свою карьеру так, чтобы всегда оставаться финансово защищенным и иметь социальные гарантии
  - Я мечтаю о работе, которая будет полностью совпадать с моими личными ценностями и убеждениями
  Тест Якоря карьеры Шейна (полная версия):
  - Я мечтаю быть настолько хорош(а) в своем деле, чтобы ко мне постоянно обращались за экспертным советом.
  - Я получаю наибольшее удовлетворение от работы, когда могу интегрировать и координировать усилия других людей.
  - Я мечтаю о карьере, которая даст мне свободу делать работу по-своему и в удобном мне ритме.
  - Безопасность и стабильность для меня важнее, чем свобода и автономия.
  - Я постоянно ищу идеи, которые позволили бы мне начать собственное дело.
  - Я почувствую себя успешным(ой) в карьере только если буду ощущать, что внес(ла) реальный вклад в благополучие общества.
  - Я мечтаю о карьере, в которой смогу решать крайне сложные задачи и побеждать в очень трудных ситуациях.
  - Я скорее уйду из организации, чем соглашусь на работу, мешающую личной и семейной жизни.
  - Я почувствую себя успешным(ой) в карьере только если смогу развить свои профессиональные навыки до очень высокого уровня.
  - Я мечтаю руководить сложной организацией и принимать решения, которые влияют на многих людей.
  - Я получаю наибольшее удовлетворение от работы, когда полностью свободен(на) в выборе задач, графика и способов работы.
  - Я скорее полностью уйду из организации, чем приму назначение, которое поставит под угрозу мою стабильность в этой организации.
  - Построить собственный бизнес для меня важнее, чем занять высокую управленческую должность в чужой организации.
  - Я получаю наибольшее удовлетворение в карьере, когда могу использовать свои таланты на благо других людей.
  - Я почувствую себя успешным(ой) в карьере только если смогу преодолевать очень трудные вызовы.
  - Я мечтаю о карьере, которая позволит мне совмещать личные, семейные и рабочие потребности.
  - Стать функциональным руководителем в своей профессиональной области для меня привлекательнее, чем стать генеральным менеджером.
  - Я почувствую себя успешным(ой) в карьере только если стану генеральным менеджером в какой-либо организации.
  - Я почувствую себя успешным(ой) в карьере только если достигну полной автономии и свободы.
  - Я ищу работу в организациях, которые дают чувство надежности и стабильности.
  - Я получаю наибольшее удовлетворение в карьере, когда создаю что-то, полностью основанное на моих идеях и усилиях.
  - Использовать свои навыки, чтобы делать мир лучше, для меня важнее, чем занимать высокую управленческую должность.
  - Наибольшее удовлетворение в карьере я испытывал(а), когда решал(а) почти неразрешимые задачи или преодолевал(а) почти невозможные обстоятельства.
  - Я чувствую себя успешным(ой) в жизни только если могу сбалансировать личные, семейные и карьерные требования.
  - Я скорее уйду из организации, чем соглашусь на ротацию, которая выведет меня из моей профессиональной области.
  - Стать генеральным менеджером для меня привлекательнее, чем стать функциональным руководителем в моей нынешней профессиональной области.
  - Возможность делать работу по-своему, без жестких правил и ограничений, для меня важнее, чем стабильность.
  - Я получаю наибольшее удовлетворение от работы, когда чувствую полную финансовую и трудовую защищенность.
  - Я почувствую себя успешным(ой) в карьере только если сумею создать нечто, что является полностью моим собственным продуктом или идеей.
  - Я мечтаю о карьере, которая вносит реальный вклад в развитие общества и человечества.
  - Я выбираю такие рабочие возможности, которые серьезно бросают вызов моим навыкам решения задач и/или соревновательности.
  - Баланс личной и профессиональной жизни для меня важнее, чем достижение высокой управленческой должности.
  - Я получаю наибольшее удовлетворение от работы, когда могу применять свои особые способности и таланты.
  - Я скорее уйду из организации, чем соглашусь на работу, которая уводит меня с траектории общего управления.
  - Я скорее уйду из организации, чем соглашусь на работу, которая уменьшает мою автономию и свободу.
  - Я мечтаю о карьере, которая дает ощущение безопасности и стабильности.
  - Я мечтаю открыть и развивать собственный бизнес.
  - Я скорее уйду из организации, чем соглашусь на назначение, которое подорвет мою возможность быть полезным(ой) другим.
  - Работа над почти неразрешимыми проблемами для меня важнее, чем достижение высокой управленческой должности.
  - Я всегда стремился(ась) к таким рабочим возможностям, которые минимизируют вмешательство работы в личную и семейную жизнь.
  Тест Климова (краткий):
  - 'А. Работа с живыми организмами (ухаживать, лечить, наблюдать за животными или растениями)

    Б. Работа с техникой и машинами (настраивать, собирать, ремонтировать приборы, механизмы, компьютеры)'
  - 'А. Работа с людьми (помогать, консультировать, обучать, оказывать услуги, лечить)

    Б. Работа с информацией и данными (анализировать, систематизировать, работать с цифрами, кодами, текстами)'
  - 'А. Работа с художественными образами (создавать, оформлять, оценивать дизайн, иллюстрации, контент)

    Б. Работа с природными системами и процессами (выращивать, улучшать, изучать экосистемы, ландшафты)'
  - 'А. Создание и преобразование материальных вещей (мастерить, изготавливать, ремонтировать, шить, строить)

    Б. Влияние на мнение и поведение людей (убеждать, продвигать, продавать, вдохновлять, рекламировать)'
  - 'А. Изучение и применение научных теорий и технологий

    Б. Обсуждение и интерпретация произведений искусства, культуры и гуманитарных тем'
  - 'А. Практическая работа с животными, растениями или природными материалами

    Б. Обучение, развитие и тренировка других людей'
  - 'А. Исполнительское или интерпретирующее творчество (музыка, театр, переосмысление произведений)

    Б. Управление и обслуживание сложных технических систем, транспорта, станков'
  - 'А. Оперативное общение и помощь людям (консультирование, поддержка, организация)

    Б. Разработка и создание творческих проектов, концепций, произведений'
  - 'А. Практический ремонт и восстановление вещей (от техники до одежды)

    Б. Контроль качества, поиск и исправление ошибок в данных, текстах, коде'
  - 'А. Забота о здоровье и благополучии животных

    Б. Точные расчеты, финансовый анализ, работа с бюджетами и отчетами'
  Тест Климова:
  - 'А. Работа с живыми организмами (ухаживать, лечить, наблюдать за животными или растениями)

    Б. Работа с техникой и машинами (настраивать, собирать, ремонтировать приборы, механизмы, компьютеры)'
  - 'А. Работа с людьми (помогать, консультировать, обучать, оказывать услуги, лечить)

    Б. Работа с информацией и данными (анализировать, систематизировать, работать с цифрами, кодами, текстами)'
  - 'А. Работа с художественными образами (создавать, оформлять, оценивать дизайн, иллюстрации, контент)

    Б. Работа с природными системами и процессами (выращивать, улучшать, изучать экосистемы, ландшафты)'
  - 'А. Создание и преобразование материальных вещей (мастерить, изготавливать, ремонтировать, шить, строить)

    Б. Влияние на мнение и поведение людей (убеждать, продвигать, продавать, вдохновлять, рекламировать)'
  - 'А. Изучение и применение научных теорий и технологий

    Б. Обсуждение и интерпретация произведений искусства, культуры и гуманитарных тем'
  - 'А. Практическая работа с животными, растениями или природными материалами

    Б. Обучение, развитие и тренировка других людей'
  - 'А. Исполнительское или интерпретирующее творчество (музыка, театр, переосмысление произведений)

    Б. Управление и обслуживание сложных технических систем, транспорта, станков'
  - 'А. Оперативное общение и помощь людям (консультирование, поддержка, организация)

    Б. Разработка и создание творческих проектов, концепций, произведений'
  - 'А. Практический ремонт и восстановление вещей (от техники до одежды)

    Б. Контроль качества, поиск и исправление ошибок в данных, текстах, коде'
  - 'А. Забота о здоровье и благополучии животных

    Б. Точные расчеты, финансовый анализ, работа с бюджетами и отчетами'
  - 'А. Научно-исследовательская работа с живыми организмами (селекция, генетика, биохимия)

    Б. Инженерно-конструкторская работа, создание новых устройств и технологий'
  - 'А. Разрешение конфликтов, помощь в социальной сфере, работа с коллективом

    Б. Работа со схемами, чертежами, техническими инструкциями и нормативами'
  - 'А. Изучение и критика культурных явлений, арт-проектов, творческих методов

    Б. Проведение лабораторных экспериментов, исследование микроорганизмов, клеток, веществ'
  - 'А. Обслуживание и наладка специализированного оборудования (медицинского, научного)

    Б. Непосредственная работа с людьми для улучшения их физического или психического состояния'
  - 'А. Структурирование информации, составление отчетов, ведение документации

    Б. Создание оригинальных текстов, сценариев, концепций, рекламных сообщений'
  - 'А. Работа в лаборатории: проведение исследований, анализов, экспериментов

    Б. Непосредственное взаимодействие с людьми для диагностики, консультации, лечения'
  - 'А. Художественное творчество, визуальное оформление пространства и объектов

    Б. Сборка, монтаж и наладка механических, электронных устройств и конструкций'
  - 'А. Организация деятельности и досуга для людей (мероприятия, путешествия, тренинги)

    Б. Публичные выступления, представления, самовыражение на сцене'
  - 'А. Производство изделий по готовым технологическим картам и спецификациям

    Б. Проектирование, создание чертежей, схем и моделей'
  - 'А. Защита растений, борьба с болезнями и вредителями, улучшение урожая

    Б. Работа с программным обеспечением, офисной техникой, цифровыми сервисами'
  Тест MBTI:
  - "После насыщенного дня вы обычно...\n А. Чувствуете прилив энергии в компании людей\n Б. Нуждаетесь в времени наедине с собой, чтобы восстановить силы"
  - "На вечеринке вы...\n А. Знакомитесь с новыми людьми, активно общаетесь со многими\n Б. Предпочитаете общаться с близкими друзьями в небольшом кругу"
  - "В незнакомой ситуации вы...\n А. Легко начинаете разговор первым\n Б. Ждете, когда к вам обратятся другие"
  - "Вы больше доверяете...\n А. Конкретной информации, фактам и опыту\n Б. Своей интуиции, общим идеям и скрытым возможностям"
  - "В работе вы предпочитаете...\n А. Ориентироваться на проверенные, надежные методы\n Б. Придумывать новые, оригинальные подходы"
  - "При изучении нового вы...\n А. Фокусируетесь на конкретных деталях и практическом применении\n Б. Ищете общие закономерности и будущие возможности"
  - "Принимая важное решение, вы в первую очередь опираетесь на...\n А. Логику, объективный анализ и справедливость.\n Б. Личные ценности и то, как это решение повлияет на чувства людей"
  - "В споре вы больше цените...\n А. Правду и объективную точность, даже если она может задеть\n Б. Гармонию отношений и тактичность в выражениях"
  - "При оценке ситуации вы обычно...\n А. Анализируете \"что правильно\" по объективным критериям\n Б. Рассматриваете \"что важно\" для вовлеченных людей"
  - "Ваш стиль работы и жизни лучше описать как...\n А. Структурированный, плановый и решительный\n Б. Гибкий, спонтанный и открытый для новых вариантов"
  - "Вы чувствуете себя комфортнее, когда...\n А. Решение принято и план утвержден\n Б. Варианты остаются открытыми для изменений по ситуации"
  - "При выполнении задач вы...\n А. Стараетесь завершить их заранее, следуя графику\n Б. Чаще работаете в последний момент, адаптируясь к обстоятельствам"
  Тест MBTI (полная версия):
  - "После длительного общения или совещания вы...\n    А. Быстро переключаетесь к делам без обязательного «переварить один» после\n    Б. Нуждаетесь уединиться хотя бы ненадолго, чтобы восстановить ресурс общения"
  - "На нейтральном мероприятии для вас свойственнее...\n    А. Активно расширять круг живых знакомств\n    Б. Поддерживать глубину в малом знакомом круге вместо ширины поверхности"
  - "Когда нужно понять незнакомую задачу, выберите более привычный старт...\n    А. Обсудить сразу с несколькими людьми и собрать живые мнения в одном времени окна\n    Б. Сначала в тишине сформулировать свой каркас понимания, потом точечные вопросы"
  - "В свободный вечер чаще тянет...\n    А. Планово выйти «в люди» или в общую активность\n    Б. Не планировать широкий контакт без необходимости — отдых малой связью или в одиночестве"
  - "При срочной проблеме в командном проекте вам органичнее...\n    А. Созвоны и живые столкновения мнений до быстрого согласования\n    Б. Чёткая переписка с минимальной синхронной толпой и конкретными ответчиками"
  - "Размышлять вслух при решении задачи нового типа вам помогает...\n    А. Слышите артикуляцию вслух себе или партнёру — так быстрее кристаллизуется решение\n    Б. Сдерживаться до зрелости мысли, пока её не смогли бы выстроить последовательно сами наедине"
  - "Публичное выступление без глубочайшего прогона сценария...\n    А. Чаще бодрит и включает в поток живого темпа\n    Б. Требует больше внутреннего времени восстановиться после впечатления"
  - "Коллективное неформальное событие в жёлтую полосу недели воспринимается как...\n    А. Полезную перезагрузку отношений и информальных каналов согласования\n    Б. Дополнительную нагрузку на уже истощённые социальные или эмоциональные резервы"
  - "Когда недоступны все данные, вы при принятии решения ближе к...\n    А. Опоры на уже проверенном опыте и измеримо похожих кейсов\n    Б. Сборке возможных паттернов вперёд в отсутствии полной картины детально сейчас"
  - "Инструкция к задаче на две страницы для вас...\n    А. Удобна пошаговой ясности и понятными чек-пунктами\n    Б. Важнее ухватить главный образ и уже самим причесать траекторию к детали"
  - "Старт изучения большого теоретического предмета...\n    А. Примеры задач по темам вплоть до конкретных чисел или артефактов\n    Б. Сначала генеральная модель связей понятий, детали — как иллюстрации второго круга"
  - "В новости главное для понимания...\n    А. Воспроизводимость фактических утверждений, дата, объективные реквизиты\n    Б. Вектор возможных вторичных последствий трендов и качественное чутьё сдвига системы"
  - "При отладке качества текстового описания задачи ваш глаз чаще ловит...\n    А. Расхождение с явно заявленными фактическими параметрами\n    Б. Подозрительную недосказанность связей между подсистемами мысленной модели"
  - "Партнёр сказал: «Я почувствовал, что здесь есть скрытый ресурс продукта»...\n    А. Вы просите определить, что наблюдалось объективно и как измеримо прокси ресурса\n    Б. Вы сначала понимаете метафору и только потом требование к наблюдению уточняете"
  - "Подготовка к отдыху в незнакомом городе типичнее...\n    А. Маршрут ориентиров с опорой на проверенную инфраструктуру и список посещений\n    Б. Отправная идея с незакрытой возможностью открыть неожиданное по дороге"
  - "Слайдовая история партнёра по стратегии вам нужна как...\n    А. Плотные факторы таблицы, сравнимые оси решений и понятная логическая цепь\n    Б. Большое направление смысла и видение нескольких этапов вперёди без захламления всем числом подряд"
  - "В спорных отношениях близких людей ваш первичный вектор действия скорее...\n    А. Честную фиксацию фактически проверимой стороны, даже если это неприятно слышать\n    Б. Сохранить доверие и возможность поддержки между людьми до ясности детального разбора"
  - "Когда нужно решить между двумя стратегиями при неидеальных последствиях для людей...\n    А. Свернуть решение через рационально сравнимое влияние метриками и условными рисками\n    Б. Сначала оценить, чья включённость и последствия болезненнее, уже потом упаковать критикой к метрикам"
  - "Коллега просит «сказать объективно» про его вклад без смягчения...\n    А. Чёткая перечислимость достоинств и зон улучшения по логике результата\n    Б. Подбор точных формулировок чтобы не заблокировать желание улучшаться у человека после эмоций"
  - "Распределение ответственности за ошибку выпуска...\n    А. По понятному принципу ролевой ответственности и прецедентов такого же масштаба\n    Б. С учётом контекста усталости, предыдущего вклада и отношенческой восстановимости"
  - "В обратной связи человеку, который просится о честности...\n    А. В первую очередь ясные требования к изменению и гранульный разбор недоработки\n    Б. В первую очередь ощущение уважаемости и совместным построением пути без уничтожения мотивации"
  - "Разногласие о ресурсе между двумя стратегиями дорожной карты...\n    А. Сводите к возможности измеримого сравнения на одной временной шкале риска\n    Б. Сводите через приоритеты ценности людей или ценность миссии, потом упаковываете расчёт"
  - "Когда нужно исключительное этическое разрешение в редком случае...\n    А. Исключение документировать узко, чтобы случай массово не эродировал общее правило\n    Б. Сначала понять живую трактовку несколькими людьми, уже потому фиксировать правило"
  - "Публично признав свою ошибку, вы в первую очередь рассчитываете...\n    А. Восстановить доверие к фактам и к следующим шагам исправления процесса\n    Б. Сохранить уважение к людям и ясность, что отношения для вас важны, затем уже к процедуре"
  - "Курсовое расписание на семестр...\n    А. Удовлетворяет, когда оно уже зафиксировано блоками недель и понятными требованиями\n    Б. Выше ценится гибкая переразметка внутри семестра по реальному пониманию материала"
  - "За три недели до дедлайна сложной подачи результатов ваш привычный режим это...\n    А. Уже разложенные промежуточные вехи закрыты или на контрольной доработке\n    Б. Вы ещё оставляете себе живую подвижность структуры до последних недель уплотнения"
  - "Выходные «без большого плана заранее»...\n    А. Оставляете дискомфорт необходимости мгновенно выбирать из пустого пространства\n    Б. Не вызывает тревоги возможность дорисовать активность уже ближе к дню или часу старта"
  - "Покупка дорогого устройства до оплаты...\n    А. Систематические сравнения характеристик и поддержки по чеклисту\n    Б. Достаточно живого впечатления и отзыва, чтобы не утопать в параметрах месяца"
  - "Цель задачи уже сформулирована, описание задачи от руководителя высокого уровня...\n    А. Спокойно, когда детали финализированы письменно или на слайде утверждения версии один\n    Б. Спокойно, когда понят общий результат, а технические параметры дорисуют по совместному уточнению"
  - "Подготовка багажа в отпуск...\n    А. Список вещей с отметкой взятости по пунктам\n    Б. Отбор ключевых вещей на ходу памятью дополняя тонкость в последние минуты"
  - "Несколько проектов с пересекающимися дедлайнами...\n    А. Расписание временных окон задач каждому проекту календарно и жёсткие гейт-точки\n    Б. Поддерживаете смешение хода и точечно ретушируете приоритет на ощущении горящего места"
  - "Сюрприз «срок дедлайна сдвинут ближе на три недели»...\n    А. Вызовет немедленную пересборку плана с новой временной решёткой\n    Б. Главную реакцию сначала переговорные и поиск живого торга целей между сторонами"
  - "В учебной неделе ваш комфорт ближе к...\n    А. Когда понят последовательный прогресс тем уже на фронте недели без хаоса переупорядочивания каждый день без причины\n    Б. Когда можно «плавать» внутри недели между блоками понимания в зависимости от скорости усвоения"
  - "При прочитанной жалобе на нечестность в маленькой команде вы сильнее хотите услышать...\n    А. Всеми объективируемые фактические цепочки событий вне эмоциональной подачи любой одной из сторон\n    Б. Подробности чувственного восприятия участников конфликта до выводов о санкционировании решения всем процессом"
  - "Ваш стиль финализации задачи на спринте...\n    А. Закрытие промежуточных целей каждого дня недели последовательно перед общим концом\n    Б. Подстраивание финального рывка под фактическое ощущение готовности сырья работы недели всей командой синхронно"
  - "При итеративной работе промежуточные артефакты между вами и заказчиком...\n    А. Удобнее чёткая сетка коротких вех без сюрпризов по качеству на каждом шагу\n    Б. Удобнее гибкая упаковка сроков, если по сути прогресс всё же виден"
  Тест Холланда/RIASEC:
  - Собирать и ремонтировать технические устройства (компьютеры, велосипеды)
  - Проводить научные эксперименты, исследовать природные явления
  - 'Заниматься творчеством: рисовать, фотографировать, писать тексты или музыку'
  - Обучать, консультировать, заботиться о других (детях, больных, пожилых)
  - Управлять людьми или проектами, убеждать, продавать
  - 'Систематизировать информацию: работать с базами данных, документами, отчетами'
  - Разбираться в устройстве сложных механизмов
  - Анализировать данные, решать логические и математические задачи
  - Играть на сцене, выступать перед аудиторией
  - Помогать людям решать их личные проблемы
  - Организовывать мероприятия и работу других людей
  - Вести учет финансов, работать с цифрами, соблюдать инструкции
  Тест Холланда/RIASEC (полная версия):
  - Ремонтировать и настраивать инструменты, станки или узлы техники
  - Собирать конструктив из чертежа, аккуратно работая материалом и узлами
  - Выезжать на объект для монтажа, установки или обслуживания техники
  - Работать на производстве с понятной последовательностью операций и физическим результатом смены
  - Управлять машинами или транспортом, где нужны управленческие навыки и координация
  - Строить, возводить, отделывать пространство по технологии с измерениями точности
  - Вести полевые или земляные работы с видимым материальным результатом труда
  - Работать с измерительными приборами и проверять реальное соответствие детали стандарту
  - Ставить эксперименты и методично фиксировать результаты наблюдений
  - Строить статистические или математические модели данных и искать закономерности
  - Разбирать научную аргументацию и воспроизводить её на языке доказательств
  - Писать или отлаживать код там, где важнее логическая строгость, чем художественный эффект
  - Выявлять причинные цепочки поломки, болезни или сбоя системы до корневой причины
  - Работа в поле или лаборатории с наблюдением природных процессов
  - 'Проектировать исследование: методика, воспроизводимость, этика данных'
  - Строить теорию или методологический инструмент для класса задач целиком
  - Придумывать визуальную композицию, стиль интерфейса или образ персонажа
  - Сочинять музыку, тексты или сценическую историю от замысла к исполнению
  - 'Руками делать авторский объект: декор, костюм, артефакт без инженерного регламента шаг за шагом'
  - Поставить творческую задачу в фото, видео или арт-проекте с эмоциональным посылом
  - Выступать исполнителем или чтецом перед живой аудиторией
  - Придумывать образ продукта, где главное идея и смысл, а не техническая сборка узла за узлом
  - Подбирать эстетическое решение для пространства, бренда, спектакля или книги целиком
  - Разбирать и интерпретировать произведение искусства через собственную оценку смысла
  - Индивидуально сопровождать человека при личном сложном решении или кризисе
  - Вести обучение с обратной связью, когда важно, как усвоил каждый участник
  - Помощь в конфликте или медиация между сторонами в рабочей команде
  - 'Работа с уязвимыми группами: забота, сопровождение, наблюдение динамики состояния'
  - Строить длительную наставническую линию, а не разовые формальные касания
  - Связать между собой группы людей с разными профессиональными языками
  - Провести коуч-сессию с фокусом на целях человека без навязывания готового ответа
  - Проектировать развитие мягких навыков с живыми упражнениями и наблюдением группы
  - Вести переговоры, где нужно добиться решения партнёра под цель организации
  - Защищать перед аудиторией идею, продукт или стартап и отвечать на возражения
  - Организовать кампанию или мероприятие с охватом и измеримыми целями
  - Подбирать людей под рост задачи и планировать, кто закроет узкие места по срокам
  - Строить дорожную карту цены и каналов партнёрств для выхода на рынок
  - Вести кризис коммуникации с быстрой синхронизацией ключевых сторон
  - Поднимать темп команды результатом через речь и соревновательную, но понятную рамку целей
  - Продавать сложное решение руководству, вплетая финансовую логику и человеческий фактор
  - Вводить проводки или транзакции и сверять, что суммы и реквизиты без ошибки
  - Вести документы строго по регламенту без отступления без записанного согласования
  - Поддерживать упорядоченный архив версий или справочник с едиными кодами элементов
  - Планировать смены, ресурсы и графики так, чтобы не было необъяснимых «дыр»
  - Собирать отчёт из однотипных статей для аудита последовательно по периоду
  - Контролировать складской учёт или движение по жёстким правилам списания
  - Размечать и классифицировать элементы набора данных по шаблону без размывания критерия
  - Применять внутренние или отраслевые стандарты в операционной задаче каждый день
  Тест PCM:
  - "В стрессовой ситуации я склонен(на):\n А. Становиться критичным, требовательным и контролирующим\n Б. Уходить в себя, замыкаться и избегать общения"
  - "Что для вас важнее в работе?\n А. Четкие инструкции, структура и предсказуемость\n Б. Возможность проявить себя, получить признание и восхищение"
  - "Как вы предпочитаете получать обратную связь?\n А. Конкретно, по делу, с фактами и примерами\n Б. Тактично, с учетом моих чувств и отношений"
  - "При принятии решений я больше опираюсь на:\n А. Логику, данные и объективный анализ\n Б. Чувства, ценности и гармонию в отношениях"
  - "Мое типичное поведение в конфликте:\n А. Ищу компромисс, стараюсь всех примирить\n Б. Настаиваю на своем, доказываю правоту"
  - "Что вас мотивирует больше всего?\n А. Конкретные цели, ясные KPI и стабильность\n Б. Признание заслуг, похвала и возможность выделиться"
  - "Как вы восстанавливаете энергию?\n А. В одиночестве, занимаясь хобби или просто отдыхая\n Б. В активном общении с интересными людьми"
  - "В команде я обычно:\n А. Следую правилам и поддерживаю установленный порядок\n Б. Бросаю вызов нормам и предлагаю нестандартные решения"
  - "При столкновении с проблемой я сначала:\n А. Анализирую все \"за\" и \"против\", составляю план\n Б. Действую импульсивно, ориентируясь на ситуацию"
  - "Что для вас важнее в общении?\n А. Чтобы оно было структурированным и по делу\n Б. Чтобы оно было теплым, эмоциональным и поддерживающим"
  - "В незнакомой ситуации я:\n А. Внимательно наблюдаю и сначала изучаю обстановку\n Б. Активно экспериментирую и сразу пробую разные подходы"
  - "Когда на меня оказывают давление, я:\n А. Становлюсь упрямым и сопротивляюсь\n Б. Стараюсь адаптироваться и найти общий язык"
  Тест PCM (полная версия):
  - "Срок очень короткий. Первым делом\n    А. Формализовать шаги и критерии готовности\n    Б. Посмотреть на людей в команде и выровнять ожидания"
  - "Разбираете сбой в продакшене\n    А. Восстановить временную шкалу и факты\n    Б. Спокойно дать каждому высказаться, потом уже факты"
