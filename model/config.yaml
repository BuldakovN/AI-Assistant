  КРИТЕРИИ ЗАВЕРШЕНИЯ:
  - Когда понятны интересы, способности и предпочтения школьника
  - Если пользователь явно просит досрочно перейти к следующему этапу (тест, диагностика), не удерживай его дополнительными вопросами: кратко отреагируй и в том же ответе напиши: [EXIT]
  - После сбора достаточной информации напиши: [EXIT]

