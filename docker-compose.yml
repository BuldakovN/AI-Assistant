version: '3.8'

services:
  crud-service:
    build:
      context: .
      dockerfile: crud-service/Dockerfile
    container_name: ai-gigaschool-crud
    env_file:
      - path: .env
        required: false
    environment:
      # БД на хосте: repo/test_app.sqlite3 (каталог repo примонтирован, файл создастся при первом запуске)
      - SQLITE_PATH=/app/persist/test_app.sqlite3
    volumes:
      - ./repo:/app/persist
    restart: unless-stopped
    networks:
      - ai-gigaschool-network

  llm-service:
    build:
      context: .
      dockerfile: model/Dockerfile.llm
    container_name: ai-gigaschool-llm
    env_file:
      - path: .env
        required: false
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-yandex}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    restart: unless-stopped
    networks:
      - ai-gigaschool-network

  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    container_name: ai-gigaschool-core
    ports:
      - "8000:8020"
    env_file:
      - path: .env
        required: false
    environment:
      - CRUD_SERVICE_URL=http://crud-service:8010
      - LLM_SERVICE_URL=http://llm-service:8001
      - WEB_SEARCH_API_URL=http://tavily-adapter:1000
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      - crud-service
      - llm-service
      - tavily-adapter
    networks:
      - ai-gigaschool-network

  telegram-bot:
    build:
      context: .
      dockerfile: tg-module/Dockerfile
    container_name: ai-gigaschool-bot
    env_file:
      - path: .env
        required: false
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - LLM_BASE_URL=http://core:8020
      - LLM_API_URL=http://core:8020/start_talk/
      - LLM_PROFESSION_API_URL=http://core:8020/get_profession_info/
      - LLM_ROADMAP_API_URL=http://core:8020/get_profession_roadmap/
      - LLM_CLEAN_API_URL=http://core:8020/clean_history/
    depends_on:
      - core
    restart: unless-stopped
    networks:
      - ai-gigaschool-network

  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    pull_policy: missing
    restart: unless-stopped
    networks:
      - ai-gigaschool-network
    ports:
      - "8999:8080"
    volumes:
      # Каталог, не один файл — иначе на Docker Desktop (Windows) часто ломается bind mount файла в settings.yml
      - ./web_search/searxng:/etc/searxng:ro
      - searxng-data:/var/cache/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8999/
      - BIND_ADDRESS=[::]:8080
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  tavily-adapter:
    build:
      context: ./web_search/simple_tavily_adapter
      dockerfile: Dockerfile
    container_name: tavily-adapter
    restart: unless-stopped
    networks:
      - ai-gigaschool-network
    ports:
      - "1000:1000"
    volumes:
      - ./web_search/searxng:/srv/searxng-docker:ro
    depends_on:
      - searxng
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

networks:
  ai-gigaschool-network:
    driver: bridge

volumes:
  logs:
    driver: local
  searxng-data:
    driver: local
